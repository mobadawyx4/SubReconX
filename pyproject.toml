[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subreconx"
version = "1.0.0"
description = "Standalone reconnaissance framework for authorized security testing"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
subreconx = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engines*", "protocols*", "sources*", "utils*"]

[tool.setuptools.data-files]
"intelligence" = [
    "intelligence/extension_categories.json",
    "intelligence/sensitive_patterns.json",
    "intelligence/takeover_fingerprints.json"
]
"wordlists" = ["wordlists/subdomains.txt"]
